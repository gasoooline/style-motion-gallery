<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="为产品经理准备的网页风格与交互动效参考库。看效果，复制 Prompt，准确表达设计方向。">
  <title>Taste Gallery | 风格与动效参考库</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="gallery.css">
</head>
<body class="home-page">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="TG Taste Gallery 首页">
      <span class="brand-mark" aria-hidden="true">TG</span>
      <span>Taste Gallery</span>
    </a>
    <nav class="main-nav" aria-label="主导航">
      <a href="styles.html">网页风格</a>
      <a href="motion.html">动效</a>
    </nav>
  </header>

  <main class="home-shell">
    <section class="home-intro" aria-labelledby="home-title">
      <p class="context-label">给产品经理的视觉词典</p>
      <h1 id="home-title">先看见，再描述。</h1>
      <p>浏览真实画面，找到接近的风格与动效，一键复制成可以直接交给 Codex 的 Prompt。</p>
    </section>

    <section class="library-choices" aria-label="选择参考库">
      <a class="library-choice style-choice" href="styles.html">
        <div class="choice-preview style-mosaic" aria-hidden="true">
          <span class="mosaic-a">Aa</span>
          <span class="mosaic-b"></span>
          <span class="mosaic-c">FORM</span>
          <span class="mosaic-d"></span>
        </div>
        <div class="choice-copy">
          <span class="choice-count">16 个方向</span>
          <h2>网页风格</h2>
          <p>从莫兰迪极简到工业粗野。比较配色、字体、布局、材质与设计参数。</p>
          <span class="choice-action">打开风格库 <span aria-hidden="true">→</span></span>
        </div>
      </a>

      <a class="library-choice motion-choice" href="motion.html">
        <div class="choice-preview motion-orbit" aria-hidden="true">
          <span class="orbit-track"></span>
          <span class="orbit-core"></span>
          <span class="orbit-item item-one"></span>
          <span class="orbit-item item-two"></span>
          <span class="orbit-item item-three"></span>
        </div>
        <div class="choice-copy">
          <span class="choice-count">20 个模式</span>
          <h2>交互动效</h2>
          <p>从淡入、交错入场到磁吸、滚动叙事。每个案例都能现场触发与重播。</p>
          <span class="choice-action">打开动效库 <span aria-hidden="true">→</span></span>
        </div>
      </a>
    </section>

    <section class="quick-combine" aria-label="使用示例">
      <span>组合表达</span>
      <code>使用 S02 的视觉方向 + M02 的交错入场，生成产品落地页</code>
    </section>
  </main>

  <footer class="site-footer">
    <span>Based on design-taste-frontend</span>
    <span>静态站点，无登录与数据采集</span>
  </footer>
</body>
</html>

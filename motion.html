<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="40 种网页交互动效的实时参考与可复制 Prompt。">
  <title>交互动效 | 风格橱柜</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="gallery.css">
</head>
<body data-gallery="motion">
  <header class="site-header detail-header">
    <a class="detail-back" href="index.html" aria-label="返回首页">
      <span aria-hidden="true">←</span>
      <span>返回首页</span>
    </a>
    <span class="detail-label">交互动效</span>
  </header>

  <main class="gallery-shell">
    <section class="gallery-heading">
      <p class="context-label">交互动效</p>
      <h1>看懂运动的感觉。</h1>
      <p>悬浮卡片即可实时体验。复制时会带上用途、触发方式、节奏与降级要求。</p>
    </section>

    <section class="filter-bar" aria-label="动效筛选">
      <label class="search-field">
        <span>搜索</span>
        <input id="motionSearch" type="search" placeholder="例如：悬浮、滚动、文字" autocomplete="off">
      </label>
      <div class="filter-tabs" id="motionFilters" role="group" aria-label="按类型筛选"></div>
      <p class="result-count" id="motionCount" aria-live="polite"></p>
    </section>

    <section class="specimen-grid motion-grid" id="motionGrid" aria-label="交互动效案例"></section>
    <section class="empty-state" id="motionEmpty" hidden>
      <h2>没有匹配的动效</h2>
      <p>换一个关键词，或选择“全部”。</p>
    </section>
  </main>
  <div class="copy-toast" id="copyToast" role="status" aria-live="polite"></div>
  <script src="common.js"></script>
  <script src="motion.js"></script>
</body>
</html>

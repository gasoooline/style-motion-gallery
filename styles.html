<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="22 种网页视觉风格的可视化参考与可复制 Prompt。">
  <title>网页风格 | 风格橱柜</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="gallery.css">
</head>
<body data-gallery="styles">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="风格橱柜首页">
      <span class="brand-mark" aria-hidden="true">TG</span>
      <span>风格橱柜</span>
    </a>
    <nav class="main-nav" aria-label="主导航">
      <a class="active" href="styles.html" aria-current="page">网页风格</a>
      <a href="motion.html">动效</a>
    </nav>
  </header>

  <main class="gallery-shell">
    <section class="gallery-heading">
      <p class="context-label">网页风格</p>
      <h1>找到接近的画面。</h1>
      <p>不需要懂设计术语。先看整体气质，再复制完整 Prompt。</p>
    </section>

    <section class="filter-bar" aria-label="风格筛选">
      <label class="search-field">
        <span>搜索</span>
        <input id="styleSearch" type="search" placeholder="例如：莫兰迪、科技、编辑" autocomplete="off">
      </label>
      <div class="filter-tabs" id="styleFilters" role="group" aria-label="按类型筛选"></div>
      <p class="result-count" id="styleCount" aria-live="polite"></p>
    </section>

    <section class="specimen-grid" id="styleGrid" aria-label="网页风格案例"></section>
    <section class="empty-state" id="styleEmpty" hidden>
      <h2>没有匹配的风格</h2>
      <p>换一个关键词，或选择“全部”。</p>
    </section>
  </main>

  <section class="taste-modal" id="styleDemoModal" role="dialog" aria-modal="true" aria-labelledby="styleDemoTitle" hidden>
    <div class="taste-modal-backdrop" data-close-demo></div>
    <div class="taste-modal-panel">
      <header class="taste-modal-header">
        <div>
          <span class="specimen-id" id="styleDemoId">S00</span>
          <h2 id="styleDemoTitle">品鉴 demo</h2>
        </div>
        <button class="modal-close-button" type="button" data-close-demo aria-label="关闭品鉴 demo">×</button>
      </header>
      <div class="taste-modal-stage" id="styleDemoStage"></div>
      <footer class="taste-modal-footer">
        <p id="styleDemoSummary"></p>
        <button class="copy-button" id="styleDemoCopy" type="button">复制 Prompt</button>
      </footer>
    </div>
  </section>

  <div class="copy-toast" id="copyToast" role="status" aria-live="polite"></div>
  <footer class="site-footer">
    <span>22 个视觉方向</span>
    <a href="motion.html">继续选择动效 <span aria-hidden="true">→</span></a>
  </footer>
  <script src="common.js"></script>
  <script src="styles.js"></script>
</body>
</html>
